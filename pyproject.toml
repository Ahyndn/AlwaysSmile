
[project]
name = "always-smile"
requires-python = ">=3.15.2,<3.16"

[tool.ruff]
target-version = "py315"
line-length = 88
indent-width = 4
src = ["."]

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    "staticfiles",
    "media",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PIE",
    "RUF",
    "TRY",
]

ignore = [
    "E501",
    "TRY003",
    "TRY301",
    "TRY300",
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
skip-magic-trailing-comma = false
