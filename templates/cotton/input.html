<c-vars
    type="text"
    placeholder=""
    disabled="false"
    class=""
/>

<input
    type="{{ type }}"
    placeholder="{{ placeholder }}"
    {% if disabled == "true" or disabled == True %}disabled{% endif %}
    class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm text-foreground shadow-sm placeholder:text-muted-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 {{ class }}"
    {{ attrs }}
/>
