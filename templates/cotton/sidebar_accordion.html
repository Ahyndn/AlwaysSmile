
<details
    name="{{ group }}"
    class="group border-b border-gray-100"
>
    <summary
        class="flex min-w-0 cursor-pointer list-none items-center justify-between gap-2 rounded-lg px-3 py-3 text-sm font-medium text-gray-700 transition hover:bg-gray-50 hover:text-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 [&::-webkit-details-marker]:hidden"
    >

        <span class="min-w-0 truncate">
            {{ title }}
        </span>

        <!-- Minimal chevron -->

        <svg
            class="h-2.5 w-2.5 shrink-0 text-gray-400 transition-transform duration-200 group-open:rotate-180"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
        >
            <path d="m6 9 6 6 6-6"/>
        </svg>

    </summary>

    <div class="space-y-1 px-3 pb-3 pl-7">
        {{ slot }}
    </div>

</details>
